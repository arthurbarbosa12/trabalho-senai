<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141518">
<title>Freio hidráulico — do pedal à roda · SENAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --y:#f2d43a;--y2:rgba(242,212,58,.18);
  --g0:#0f1012;--g1:#141518;--g2:#1b1d21;--g3:#24272c;
  --w:#f4f5f7;--w2:rgba(244,245,247,.62);--w3:rgba(244,245,247,.32);--w4:rgba(244,245,247,.12);
  --gray:#c9ccd1;--ink:#121316;
  --ease:cubic-bezier(.22,1,.36,1);--ease-io:cubic-bezier(.65,0,.35,1);
  --font:"Archivo","Inter","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:var(--w);font-family:var(--font);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{position:relative;overflow:hidden;background:var(--g1);transition:background-color .9s ease}
#stage.light{background:var(--gray)}

/* ───── slides + transição "mergulho de câmera" ───── */
.slide{position:absolute;inset:0;visibility:hidden;opacity:0;overflow:hidden}
.slide.active{visibility:visible;opacity:1;z-index:2;animation:inF 1.1s var(--ease) both}
.slide.leaving{visibility:visible;z-index:1;pointer-events:none;animation:outF .75s var(--ease-io) both}
.slide.active.back{animation-name:inB}
.slide.leaving.back{animation-name:outB}
.slide.instant{animation:none!important}
@keyframes inF{from{opacity:0;transform:scale(.9);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes outF{to{opacity:0;transform:scale(1.18);filter:blur(12px)}}
@keyframes inB{from{opacity:0;transform:scale(1.15);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes outB{to{opacity:0;transform:scale(.9);filter:blur(12px)}}

/* entrada dos elementos */
.rv{opacity:0}
.slide.active .rv{animation:rv .9s var(--ease) both;animation-delay:calc(.3s + var(--d,0s))}
@keyframes rv{from{opacity:0;transform:translateY(1.2em);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

.dark{background:var(--g1)}
.dark .grid{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--w4) 1px,transparent 1px),linear-gradient(90deg,var(--w4) 1px,transparent 1px);
  background-size:5em 5em;-webkit-mask:radial-gradient(ellipse 75% 70% at 55% 55%,#000 30%,transparent 85%);mask:radial-gradient(ellipse 75% 70% at 55% 55%,#000 30%,transparent 85%)}
.full{position:absolute;inset:0;width:100%;height:100%;display:block}

/* tipografia */
.kick{font-family:var(--mono);font-size:.82em;letter-spacing:.22em;text-transform:uppercase;color:var(--w2);display:flex;align-items:center;gap:.9em}
.kick b{color:var(--y);font-weight:500}
.kick i{display:block;width:2.4em;height:1px;background:currentColor;opacity:.5}
.h{font-weight:700;text-transform:uppercase;letter-spacing:-.01em;line-height:.98;font-size:4.1em;margin-top:.35em}
.p{font-size:1.55em;line-height:1.38;color:var(--w2);margin-top:.9em;max-width:20em}
.p b{color:var(--w);font-weight:600}
.txt{position:absolute;left:6em;top:6.2em;z-index:3;width:40em}
.ylab{display:inline-flex;align-items:center;gap:.6em;font-weight:600;text-transform:uppercase;font-size:.95em;letter-spacing:.04em}
.ylab::before{content:"";width:3px;height:1.2em;background:var(--y)}
.hint{position:absolute;left:6em;bottom:4.4em;z-index:3;font-family:var(--mono);font-size:.78em;letter-spacing:.2em;text-transform:uppercase;color:var(--w3);display:flex;align-items:center;gap:.8em;transition:opacity .5s}
.hint kbd{font-family:var(--mono);border:1px solid var(--w3);border-radius:.35em;padding:.2em .55em;color:var(--w2)}
.hint.off{opacity:0}

/* desenhos técnicos */
svg .ln{fill:none;stroke:var(--w);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg .ln2{fill:none;stroke:var(--w3);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg .ln3{fill:none;stroke:var(--w4);stroke-width:1.2}
svg .fl{fill:var(--g1)}
svg .lbl{fill:var(--w);font-family:var(--font);font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
svg .lbl2{fill:var(--w2);font-family:var(--font);font-size:19px}
svg .mono{fill:var(--w3);font-family:var(--mono);font-size:15px;letter-spacing:.18em}
svg .act .ln,svg .act.ln{stroke:var(--y)}
svg .act .fl{fill:rgba(242,212,58,.08)}
svg .ln,svg .fl{transition:stroke .5s,fill .5s}
svg .ybar{fill:var(--y)}

/* ───── 1 · capa ───── */
.s1{background:linear-gradient(180deg,#d4d7db 0%,#c6c9ce 62%,#b9bcc2 100%);color:var(--ink)}
.s1 .vig{position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 55% 70%,rgba(255,255,255,.35),transparent 70%)}
.s1-top{position:absolute;left:5.5em;top:4.6em;right:5.5em;z-index:1}
.s1 .kick{color:rgba(18,19,22,.6)}
.s1 .kick b{color:var(--ink)}
.giant{font-weight:800;text-transform:uppercase;font-size:9.6em;line-height:.86;letter-spacing:-.035em;color:#16171a;margin-top:.12em;white-space:nowrap}
.giant span{display:block}
.s1-sub{position:absolute;right:5.5em;top:5.2em;text-align:right;font-family:var(--mono);font-size:.82em;letter-spacing:.22em;text-transform:uppercase;line-height:1.9;color:rgba(18,19,22,.65)}
.s1-sub b{display:block;color:var(--ink);font-family:var(--font);font-size:2.1em;letter-spacing:-.01em;text-transform:none;font-weight:600;line-height:1.1;margin-bottom:.3em}
.car{position:absolute;left:0;right:0;bottom:6.5%;width:100%;height:66%;z-index:2}
.s1-q{position:absolute;left:5.5em;bottom:3.4em;z-index:3;display:flex;gap:1em;align-items:stretch;max-width:34em}
.s1-q::before{content:"";flex:none;width:4px;background:var(--y);border-radius:2px}
.s1-q p{font-size:1.6em;font-weight:600;line-height:1.25;color:var(--ink)}
.s1-team{position:absolute;right:5.5em;bottom:3.6em;z-index:3;font-family:var(--mono);font-size:.78em;letter-spacing:.16em;text-transform:uppercase;color:rgba(18,19,22,.62);text-align:right;line-height:1.9}
.s1-team b{color:var(--ink);font-weight:500}
.car .body{fill:rgba(28,30,34,.13);stroke:#16171a;stroke-width:2.4;stroke-linejoin:round}
.car .glass{fill:rgba(28,30,34,.1);stroke:#16171a;stroke-width:1.6}
.car .det{fill:none;stroke:rgba(22,23,26,.5);stroke-width:1.4;stroke-linecap:round}
.car .tire{fill:#18191c}
.car .rim{fill:#2b2e33;stroke:#7b8088;stroke-width:2}
.car .sys{fill:none;stroke:#16171a;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.car .sysf{fill:rgba(22,23,26,.22);stroke:#16171a;stroke-width:2.2}
.car .lead{stroke:rgba(18,19,22,.55);stroke-width:1.3;fill:none}
.car .mk{fill:var(--y);stroke:#16171a;stroke-width:2}
.car .mkp{fill:none;stroke:#16171a;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:mkp 2.2s ease-out infinite}
@keyframes mkp{from{transform:scale(1);opacity:.7}to{transform:scale(3);opacity:0}}
.car .clab{font-family:var(--font);font-weight:700;font-size:21px;letter-spacing:.06em;fill:#16171a;text-transform:uppercase}
.car .shadow{fill:url(#shd)}
.car .mkg{opacity:0}
.slide.active .car .mkg{animation:fadeIn .7s var(--ease) both;animation-delay:var(--d)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.slide.active .car .drive{animation:drive 1.6s var(--ease) both .15s}
@keyframes drive{from{transform:translateX(-9%);opacity:0}to{transform:none;opacity:1}}

/* ───── locator ───── */
.loc{position:absolute;right:5.5em;bottom:4.2em;z-index:3;width:15em;text-align:right}
.loc svg{width:100%;display:block}
.loc .body{fill:none;stroke:var(--w3);stroke-width:5}
.loc .wh{fill:none;stroke:var(--w3);stroke-width:5}
.loc .dot{fill:var(--y)}
.loc .ring{fill:none;stroke:var(--y);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:mkp 2s ease-out infinite}
.loc span{display:block;font-family:var(--mono);font-size:.7em;letter-spacing:.2em;text-transform:uppercase;color:var(--w3);margin-top:.6em}
.loc span b{color:var(--y);font-weight:500}

/* ───── 2 · pedal ───── */
.boostcap{opacity:.35;transition:opacity .6s .4s}
.on .boostcap{opacity:1}
.diaph{transition:transform 1.1s var(--ease);transform-box:fill-box;transform-origin:center}
.on .diaph{transform:translateX(12px)}
.mcpist{transition:transform 1.1s var(--ease)}
.on .mcpist{transform:translateX(22px)}
.farrow{opacity:0;transition:opacity .4s,transform .9s var(--ease);transform:translate(-30px,0)}
.on .farrow{opacity:1;transform:translate(0,0)}

/* ───── 4 · roda ───── */
.brake-btn{position:absolute;left:6em;bottom:7.2em;z-index:4;display:flex;align-items:center;gap:1.2em;padding:1em 1.6em 1em 1em;border-radius:999px;border:1.5px solid var(--w3);background:rgba(20,21,24,.7);touch-action:none;-webkit-touch-callout:none;transition:border-color .3s,background .3s,transform .2s}
.brake-btn .kn{width:3.6em;height:3.6em;border-radius:50%;border:2px solid var(--w2);display:grid;place-items:center;transition:all .3s}
.brake-btn .kn i{width:1.2em;height:1.2em;border-radius:50%;background:var(--w)}
.brake-btn b{display:block;font-size:1.7em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:left}
.brake-btn small{display:block;font-family:var(--mono);font-size:.72em;letter-spacing:.16em;text-transform:uppercase;color:var(--w3);text-align:left;margin-top:.2em}
.brake-btn.on{border-color:var(--y);background:rgba(242,212,58,.12);transform:scale(.97)}
.brake-btn.on .kn{border-color:var(--y);background:var(--y)}
.brake-btn.on .kn i{background:var(--ink)}
.rpm{position:absolute;left:6em;bottom:15.2em;z-index:4;font-family:var(--mono);font-size:.78em;letter-spacing:.2em;text-transform:uppercase;color:var(--w3)}
.rpm b{display:block;font-family:var(--font);font-size:3.4em;letter-spacing:-.02em;color:var(--w);font-weight:700;line-height:1;margin-top:.2em}
.rpm .bar{width:16em;height:3px;background:var(--w4);margin-top:.8em;border-radius:2px;overflow:hidden}
.rpm .bar i{display:block;height:100%;background:var(--w);transition:background .3s}

/* ───── 5 · maquete ───── */
.map{position:absolute;left:6em;right:6em;top:16.5em;bottom:6.5em;display:grid;grid-template-columns:1.05fr 1fr;grid-template-rows:1fr auto;gap:1.6em 3em}
.map .draw{position:relative;border:1px solid var(--w4);border-radius:1em;background:rgba(255,255,255,.015)}
.map .draw svg{position:absolute;inset:0;width:100%;height:100%}
.pairs{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:1em}
.pair{border-top:2px solid var(--w4);padding-top:.8em;opacity:.35;transition:opacity .5s,border-color .5s}
.pair.seen{opacity:.75}
.pair.cur{opacity:1;border-color:var(--y)}
.pair .n{font-family:var(--mono);font-size:.72em;letter-spacing:.2em;color:var(--w3)}
.pair.cur .n{color:var(--y)}
.pair .a{font-size:1.15em;font-weight:600;margin-top:.35em;line-height:1.25}
.pair .eq{font-family:var(--mono);font-size:.7em;letter-spacing:.18em;text-transform:uppercase;color:var(--w3);margin:.45em 0 .25em}
.pair .b{font-size:1.15em;color:var(--w2);line-height:1.25}
.pair.cur .b{color:var(--y)}
.badge{opacity:0;transition:opacity .4s}
.badge.show{opacity:1}
.badge circle{fill:var(--y)}
.badge text{fill:var(--ink);font-family:var(--font);font-weight:700;font-size:20px}
.dim{opacity:.4;transition:opacity .5s}
.dim.act{opacity:1}

/* fotos */
.photo{position:relative;width:100%;height:100%;border-radius:1em;overflow:hidden;background:var(--g2);border:1px solid var(--w4)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7em;text-align:center;padding:1em;border:2px dashed var(--w4);border-radius:1em}
.photo .ph svg{width:3em;height:3em;stroke:var(--w3)}
.photo .ph b{font-size:1.15em;font-weight:600;color:var(--w2)}
.photo .ph code{font-family:var(--mono);font-size:.72em;color:var(--w3)}
.photo.drag{box-shadow:0 0 0 3px var(--y)}
.photo .tag{position:absolute;left:1em;top:1em;font-family:var(--mono);font-size:.7em;letter-spacing:.2em;text-transform:uppercase;background:rgba(15,16,18,.75);padding:.5em .8em;border-radius:.4em;color:var(--w2)}

/* ───── 6 · montagem ───── */
.build{position:absolute;left:6em;right:6em;top:15.5em;bottom:6.5em;display:grid;grid-template-columns:1.55fr 1fr;gap:3em}
.frames{position:relative}
.frames .photo{position:absolute;inset:0;opacity:0;transform:scale(1.03);transition:opacity .7s var(--ease),transform 1.2s var(--ease)}
.frames .photo.cur{opacity:1;transform:none}
.cap{display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:.5em}
.cap .cnt{font-family:var(--mono);font-size:.8em;letter-spacing:.2em;color:var(--w3)}
.cap .cnt b{color:var(--y);font-weight:500}
.cap .ct{position:relative;margin-top:1em;min-height:8.5em}
.cap .ct p{position:absolute;left:0;bottom:0;font-size:2.1em;font-weight:600;line-height:1.22;opacity:0;transform:translateY(.6em);transition:opacity .6s,transform .8s var(--ease)}
.cap .ct p.cur{opacity:1;transform:none}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:.6em;margin-top:2em}
.thumbs i{height:3px;background:var(--w4);border-radius:2px;transition:background .4s}
.thumbs i.done{background:var(--w2)}
.thumbs i.cur{background:var(--y)}
.final{position:absolute;inset:0;z-index:5;opacity:0;visibility:hidden;transition:opacity 1s var(--ease),visibility 1s}
.final.show{opacity:1;visibility:visible}
.final .photo{border-radius:0;border:0;height:100%}
.final .photo .ph{border-radius:0}
.final .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,11,13,.92) 0%,rgba(10,11,13,.35) 45%,rgba(10,11,13,.1) 70%);pointer-events:none}
.final .live{position:absolute;left:6em;bottom:6em;pointer-events:none}
.final .live .kick{color:var(--y)}
.final .live h2{font-weight:800;text-transform:uppercase;font-size:7.2em;line-height:.88;letter-spacing:-.03em;margin-top:.15em}
.final .dotlive{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:#ff3b3b;box-shadow:0 0 0 0 rgba(255,59,59,.6);animation:live 1.6s infinite}
@keyframes live{to{box-shadow:0 0 0 1em rgba(255,59,59,0)}}

/* ───── controles ───── */
.ui{position:absolute;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:.55em;padding:1.1em 1.3em;transition:opacity .4s,transform .4s}
.ui.idle{opacity:0;transform:translateY(8px);pointer-events:none}
.cb{width:2.8em;height:2.8em;border-radius:50%;display:grid;place-items:center;background:rgba(20,21,24,.72);border:1px solid rgba(255,255,255,.14);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:all .25s}
.cb:hover{border-color:rgba(255,255,255,.5)}
.cb:disabled{opacity:.3;cursor:default}
.cb.pri{background:var(--y);color:var(--ink);border-color:var(--y)}
.cb svg{width:1.25em;height:1.25em}
.cnt2{display:flex;flex-direction:column;align-items:center;gap:.35em;min-width:4.6em;padding:.45em .7em;border-radius:1.5em;background:rgba(20,21,24,.72);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.cnt2 .num{font-family:var(--mono);font-size:.85em;color:#fff;letter-spacing:.06em}
.cnt2 .num span{color:rgba(255,255,255,.45)}
.dots{display:flex;gap:.3em;height:.35em}
.dots i{width:.35em;height:.35em;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.on{background:var(--y)}
.prog{position:absolute;left:0;top:0;height:3px;background:var(--y);z-index:20;transition:width .8s var(--ease)}

.menu{position:absolute;inset:0;z-index:30;background:rgba(12,13,15,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:5em 6em;opacity:0;visibility:hidden;transition:.35s}
.menu.open{opacity:1;visibility:visible}
.menu h3{font-size:2.6em;font-weight:700;text-transform:uppercase;margin:.3em 0 1.2em}
.menu .mg{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2em}
.menu button{text-align:left;padding:1.4em;border-radius:1em;border:1px solid var(--w4);background:rgba(255,255,255,.02);transition:border-color .3s}
.menu button:hover{border-color:var(--w3)}
.menu button.cur{border-color:var(--y)}
.menu button span{font-family:var(--mono);font-size:.8em;letter-spacing:.2em;color:var(--w3)}
.menu button b{display:block;font-size:1.5em;font-weight:700;text-transform:uppercase;margin-top:.4em}
.menu .x{position:absolute;right:5em;top:4.6em}
.menu .tip{margin-top:2.2em;font-family:var(--mono);font-size:.78em;letter-spacing:.12em;color:var(--w3)}

.rotate{display:none;position:fixed;left:0;right:0;bottom:1.2em;text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55);z-index:50;pointer-events:none}
@media (orientation:portrait) and (max-width:899px){.rotate{display:block}}
.loc.top{top:3.4em;bottom:auto}
.pair .a,.pair .b{font-size:1.3em}
.pair .eq{font-size:.75em}
.rpm{bottom:17.8em}

/* ───── desenho da maquete ───── */
.draw{position:relative;border:1px solid var(--w4);border-radius:1em;background:rgba(255,255,255,.015);overflow:hidden}
.draw>svg{position:absolute;inset:0;width:100%;height:100%}
.draw.drag,.final.drag{box-shadow:inset 0 0 0 3px var(--y)}
.frames.draw{position:relative}
.mg{transition:opacity .9s var(--ease)}
.mg.hid{opacity:0}
svg .hose-o{fill:none;stroke:var(--w);stroke-width:14;stroke-linecap:round;transition:stroke .5s}
svg .hose-i{fill:none;stroke:var(--g1);stroke-width:10;stroke-linecap:round}
svg .water{fill:none;stroke:var(--y);stroke-width:5;stroke-linecap:round;opacity:0;transition:opacity .6s}
svg .act .hose-o{stroke:var(--y)}
svg.wet .water{opacity:.9}
svg .drop{fill:var(--w2);transition:fill .5s}
svg .act .drop{fill:var(--y)}
svg .spin{fill:none;stroke:var(--y);stroke-width:4;stroke-linecap:round;stroke-dasharray:34 626;opacity:0;transition:opacity .5s}
svg.spinning .spin{opacity:1;animation:cdspin 1.1s linear infinite}
@keyframes cdspin{to{stroke-dashoffset:-660}}
.photo.ovl{position:absolute;inset:0;border:0;border-radius:0;background:none;pointer-events:none;opacity:0;transition:opacity .7s var(--ease)}
.photo.ovl.has{background:var(--g2)}
.frames .photo.ovl.has.cur,.map .photo.ovl.has,.final .photo.ovl.has{opacity:1}
.addph{position:absolute;right:1em;top:1em;z-index:3;font-family:var(--mono);font-size:.68em;letter-spacing:.16em;text-transform:uppercase;color:var(--w3);border:1px solid var(--w4);border-radius:999px;padding:.5em .9em;background:rgba(20,21,24,.75);transition:color .3s,border-color .3s}
.addph:hover{color:var(--w);border-color:var(--w3)}
.final{background:var(--g1)}
.fdraw{position:absolute;right:3em;top:4em;bottom:3em;width:62%}
.fdraw svg{width:100%;height:100%}
.final .shade{background:linear-gradient(90deg,rgba(15,16,18,.85) 0%,rgba(15,16,18,.2) 45%,transparent 70%)}
.final .photo.ovl.has~.shade{background:linear-gradient(0deg,rgba(10,11,13,.92) 0%,rgba(10,11,13,.35) 45%,rgba(10,11,13,.1) 70%)}
.final .addph{right:6em;top:3em}
.fdraw{right:4em;top:3em;bottom:22em;width:70%}
.pairs{grid-template-columns:repeat(6,1fr)}
.pair .a,.pair .b{font-size:1.18em}
svg .lead2{fill:none;stroke:var(--y);stroke-width:1.5}
.ptag{opacity:0;transition:opacity .6s .4s}
.ptag.show,#padTagF{opacity:1}
svg .push{transition:transform .6s var(--ease)}
svg.wet .push{transform:translateX(-5px)}
.fdraw{bottom:20em}


/* ═════════ MODO JOGO ═════════ */
.pedals{position:absolute;left:6em;bottom:3em;z-index:15;display:none;align-items:flex-end;gap:1.1em}
.pedals.show{display:flex}
.pedals.brake-only .gas{display:none}
#stage[data-s="0"] .pedals{left:50%;transform:translateX(-50%);bottom:2.4em}
#stage[data-s="5"] .pedals{bottom:auto;top:3.6em;left:auto;right:6em}
.pdl{position:relative;display:flex;flex-direction:column;align-items:center;gap:.45em;touch-action:none;-webkit-touch-callout:none}
.pdl .pd{display:block;border-radius:.7em .7em 1em 1em;border:2px solid var(--w3);background:repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 3px,transparent 3px 9px),linear-gradient(180deg,#2b2e34,#16181b);
  box-shadow:0 .5em 1em rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15);transform:perspective(20em) rotateX(18deg);transform-origin:50% 100%;transition:transform .12s,border-color .2s,box-shadow .2s}
.pdl.gas .pd{width:3.4em;height:6.4em}
.pdl.brk .pd{width:6.6em;height:4.8em}
.pdl b{font-size:.95em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--w)}
.pdl small{font-family:var(--mono);font-size:.62em;letter-spacing:.15em;color:var(--w3);margin-top:-.3em}
.pdl.on .pd{transform:perspective(20em) rotateX(42deg) translateY(.25em);border-color:var(--y);box-shadow:0 .2em .5em rgba(0,0,0,.5),0 0 1.4em rgba(242,212,58,.35)}
.pdl.brk.on .pd{border-color:#ff4a3d;box-shadow:0 .2em .5em rgba(0,0,0,.5),0 0 1.4em rgba(255,74,61,.45)}
.light .pdl b{color:var(--ink)} .light .pdl small{color:rgba(18,19,22,.55)}
.light .pdl .pd{border-color:rgba(18,19,22,.45)}

.hint{left:19em;bottom:4.8em}
.hud1{position:absolute;right:5.5em;top:13.5em;z-index:3;text-align:right;color:var(--ink);font-family:var(--mono);font-size:.78em;letter-spacing:.18em;text-transform:uppercase}
.hud1 b{display:block;font-family:var(--font);font-size:3.6em;letter-spacing:-.02em;font-weight:800;line-height:1;margin:.15em 0 .5em}
.hud1 b i{font-style:normal}
.hud1 .pbar{width:16em;height:4px;background:rgba(18,19,22,.15);margin:0 0 .5em auto;border-radius:2px;overflow:hidden}
.hud1 .pbar i{display:block;height:100%;width:0;background:#e0321f}
.car .sys,.car .sysf{transition:stroke .2s,fill .2s}
.car .hot .sys{stroke:#d1a400;stroke-width:4.5}
.car .hot .sysf{stroke:#d1a400;fill:rgba(242,212,58,.55)}
.car .mkg.hot .mk{fill:#ff4a3d}
.car .mkg.hot .clab{fill:#b8860b}
.rpm b i,.gauge3 b i,.ghud b i{font-style:normal}
.gauge3{position:absolute;right:6em;top:22em;z-index:3;text-align:right;font-family:var(--mono);font-size:.78em;letter-spacing:.2em;text-transform:uppercase;color:var(--w3)}
.gauge3 b{display:block;font-family:var(--font);font-size:3.4em;font-weight:800;color:var(--y);letter-spacing:-.02em;margin-top:.15em}
.rpm{bottom:13em}
.rpm b{font-size:3em}

/* desafio */
#sG .txt{top:5em}
.ghud{position:absolute;right:6em;top:5.4em;z-index:3;display:flex;gap:2.6em}
.ghud span{display:block;font-family:var(--mono);font-size:.75em;letter-spacing:.2em;text-transform:uppercase;color:var(--w3)}
.ghud b{display:flex;align-items:baseline;gap:.3em;font-size:3.4em;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.ghud b small{font-size:.32em;font-weight:500;color:var(--w2);letter-spacing:.1em}
.ghud div:last-child b{font-size:2.2em;color:var(--y);padding-top:.35em}
.gsys{position:absolute;left:50%;bottom:3.4em;transform:translateX(-30%);z-index:3}
.gsys span{display:block;font-family:var(--mono);font-size:.72em;letter-spacing:.2em;text-transform:uppercase;color:var(--w3);margin-bottom:.6em}
.gsys div{display:flex;gap:.4em}
.gsys i{font-style:normal;font-size:.95em;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:.5em .9em;border-radius:999px;border:1px solid var(--w4);color:var(--w3);transition:all .15s}
.gsys i.on{border-color:var(--y);color:var(--ink);background:var(--y)}
.gmsg{position:absolute;left:50%;top:16.5em;transform:translateX(-50%);z-index:4;text-align:center;pointer-events:none}
.gmsg b{display:block;font-size:3em;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
.gmsg span{display:block;font-size:1.2em;color:var(--w2);margin-top:.3em}
.gmsg button{pointer-events:auto;display:none;margin:1em auto 0;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:.8em 1.6em;border-radius:999px;background:var(--y);color:var(--ink)}
.gmsg.again button{display:block}
.gmsg.good b{color:var(--y);animation:pop .6s var(--ease)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
#sG .gk text.mono{fill:var(--w3)}
/* ajustes de posição */
.s1-q{bottom:auto;top:24.6em}
#stage[data-s="0"] .pedals{left:5.5em;transform:none;bottom:2.2em}
.gauge3{right:auto;left:6em;top:25em;text-align:left}
.gsys{left:auto;right:6em;bottom:auto;top:11.4em;transform:none;text-align:right}
.gsys div{justify-content:flex-end}
.gauge3{top:auto;bottom:12em}

  function wheel(cx, cy, front, id) {

  function maq(p) {

  /* ═════════ SLIDES ═════════ */
  var S = []

  S.push('<section class="slide dark" id="s2"><div class="grid"></div>' +

    else { var r = (de.requestFullscreen || de.webkitRequestFullscreen).call(de); if (r && r.catch) r.catch(function () {}) }
  }
  $('bFs').onclick = toggleFs
  function onFs() { $('bFs').innerHTML = isFs() ? IC.fs2 : IC.fs }
  document.addEventListener('fullscreenchange', onFs); document.addEventListener('webkitfullscreenchange', onFs)

  window.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return
    var k = e.key
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); next() }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); prev() }
    else if (k === 'r' || k === 'R') { if (idx === 4) game.reset() }
    else if (k === 'Home') go(0, 0)
    else if (k === 'End') go(total - 1, SL[total - 1].steps)
    else if (k === 'f' || k === 'F') toggleFs()
    else if (k === 'm' || k === 'M') setMenu(!menu.classList.contains('open'))
    else if (k === 'Escape') setMenu(false)
    else if (/^[1-7]$/.test(k)) go(+k - 1, 0)
  })

  var t0 = null
  stage.addEventListener('touchstart', function (e) {
    if (e.target.closest('[data-noswipe]') || menu.classList.contains('open')) { t0 = null; return }
    var t = e.touches[0]; t0 = { x: t.clientX, y: t.clientY, t: Date.now() }
  }, { passive: true })
  stage.addEventListener('touchend', function (e) {
    if (!t0) return
    var t = e.changedTouches[0], dx = t.clientX - t0.x, dy = t.clientY - t0.y
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3 && Date.now() - t0.t < 900) { dx < 0 ? next() : prev() }
    t0 = null
  }, { passive: true })

  var hover = window.matchMedia && window.matchMedia('(hover: hover)').matches, idleT
  function wake() {
    $('ui').classList.remove('idle'); stage.style.cursor = ''
    clearTimeout(idleT)
    if (hover) idleT = setTimeout(function () { if (!menu.classList.contains('open')) { $('ui').classList.add('idle'); stage.style.cursor = 'none' } }, 2600)
  }
  window.addEventListener('mousemove', wake); wake()

  var h0 = parseInt((location.hash || '').slice(1), 10)
  go(isFinite(h0) ? h0 - 1 : 0, 0, true)
  requestAnimationFrame(loop)
})()

</script>
